<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 경제 한 장 · 준비 중</title>
<style>
:root{color-scheme:light;--plane:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--border:rgba(11,11,11,.1)}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--plane:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--border:rgba(255,255,255,.1)}}
body{margin:0;background:var(--plane);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
display:grid;place-items:center;min-height:100vh;padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px 24px;max-width:460px}
h1{font-size:19px;margin:0 0 10px}p{color:var(--ink2);font-size:14px;line-height:1.7;margin:0 0 8px}
code{background:var(--plane);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:12.5px}
</style></head><body>
<div class="card">
<h1>아직 첫 브리핑이 생성되지 않았습니다</h1>
<p>저장소의 <b>Actions</b> 탭에서 <code>매일 경제 브리핑</code> 워크플로를 한 번 실행하면
이 페이지가 그날의 브리핑으로 교체됩니다.</p>
<p>먼저 <code>check_only = true</code> 로 실행해 소스 상태를 확인한 뒤,
<code>false</code> 로 다시 실행하세요.</p>
</div></body></html>
